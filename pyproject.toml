[project]
name = "jevjudge-bench"
version = "0.1.0"
description = "Failure-oriented, reproducible comparisons of Jev and LLM judges"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pyarrow>=21,<24", "jsonschema>=4.23,<5"]

[project.scripts]
jevjudge = "jevjudge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevjudge"]

[tool.hatch.build.targets.wheel.force-include]
"shared/rubric.json" = "jevjudge/_shared/rubric.json"
"shared/contracts.schema.json" = "jevjudge/_shared/contracts.schema.json"
"shared/fixtures.json" = "jevjudge/_shared/fixtures.json"
